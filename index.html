<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N5 단어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>N5 단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#1E2330; --muted:#6A7180; --line:#DFE3EA; --soft:#EEF1F5;
  --ai:#2B4785; --ai-ink:#FFFFFF; --ai-soft:#E5EBF7;
  --red:#CF3A2C; --red-soft:#FBE8E5; --ok:#23784A; --ok-soft:#E3F3EA;
  --jp:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12151C; --card:#1B1F29; --ink:#E7E9EE; --muted:#9AA1B0; --line:#2C3242; --soft:#232837;
  --ai:#93ABEA; --ai-ink:#0F1423; --ai-soft:#23314F;
  --red:#F27464; --red-soft:#3B2321; --ok:#6CC495; --ok-soft:#1D3528; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.screen{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.jp{font-family:var(--jp);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* top bars */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.top h2{margin:0;font-size:18px;flex:1;text-align:center}
.back,.link{color:var(--ai);font-size:16px;padding:10px 4px;min-width:60px;text-align:left}
.link{text-align:right}

/* cards & buttons */
.card{background:var(--card);border-radius:16px;padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-weight:600;font-size:17px}
.btn.primary{background:var(--ai);color:var(--ai-ink)}
.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:none;color:var(--muted);font-weight:500;min-height:46px}
.btn:disabled{opacity:.4}
.btn.sm{min-height:40px;font-size:15px;width:auto;padding:0 16px;border-radius:10px}

/* home */
.today{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:76px;height:76px;border-radius:50%;flex:none;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--card) 79%,transparent 81% 100%),conic-gradient(var(--ai) calc(var(--p)*1%),var(--soft) 0)}
.ring b{font-size:22px;line-height:1} .ring span{font-size:12px;color:var(--muted)}
.ring.done{background:radial-gradient(closest-side,var(--card) 79%,transparent 81% 100%),conic-gradient(var(--red) 100%,var(--soft) 0)}
.ring.done b{color:var(--red);font-family:var(--jp);font-size:24px}
.today h3{margin:0;font-size:17px}
.today p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.streak{color:var(--red);font-weight:700}
.tile{background:var(--card);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:76px}
.tile b{font-size:17px}
.tile span{font-size:14px;color:var(--muted)}
.tile .badge{color:var(--red);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.progress{display:flex;flex-direction:column;gap:8px}
.progress .row{display:flex;justify-content:space-between;font-size:14px}

/* segmented options */
.opt{display:flex;flex-direction:column;gap:8px}
.opt label{font-size:14px;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink);border-color:var(--ai);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:0}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px}
.qbar .x{font-size:15px;color:var(--muted);padding:10px 2px}
.qbar .bar{flex:1}
.qbar .bar i{background:var(--ai)}
.qbar .count{font-size:14px;color:var(--muted);min-width:44px;text-align:right}
.prompt{position:relative;background:var(--card);border-radius:18px;padding:36px 16px 26px;text-align:center;overflow:hidden}
.prompt .tag{font-size:12px;font-weight:600;color:var(--ai);background:var(--ai-soft);padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:10px}
.prompt .big{font-family:var(--jp);font-weight:600;font-size:clamp(40px,12vw,64px);line-height:1.2;overflow-wrap:anywhere}
.prompt .big.ko{font-family:var(--ui);font-size:clamp(28px,8vw,40px)}
.prompt .big.sent{font-size:clamp(22px,6vw,30px);line-height:1.6}
.prompt .sub{color:var(--muted);margin-top:6px}
.prompt .ask{color:var(--muted);font-size:14px;margin-top:12px}
.mark{position:absolute;right:12px;top:10px;width:80px;height:80px;pointer-events:none}
.mark path{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
.choice{background:var(--card);border:1.5px solid var(--line);border-radius:14px;min-height:60px;padding:12px 16px;text-align:left;font-size:18px;display:flex;align-items:center}
.choice.jp{font-size:23px}
.choice .rd{display:block;font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:500;line-height:1.3}
.prompt .sub.jp{font-size:20px;color:var(--muted)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.dim{opacity:.45}
.typein{display:flex;gap:8px}
.typein input{flex:1;min-width:0;font-size:20px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.typein input.right{border-color:var(--ok);background:var(--ok-soft)} .typein input.wrong{border-color:var(--red);background:var(--red-soft)}
.typein .btn{width:auto;padding:0 20px}
.ans{background:var(--card);border-radius:14px;padding:14px 16px;border-left:4px solid var(--ok)}
.ans.ng{border-left-color:var(--red)}
.ans .v{font-size:13px;font-weight:700;color:var(--ok)} .ans.ng .v{color:var(--red)}
.ans .w{font-family:var(--jp);font-weight:600;font-size:24px}
.ans .r{color:var(--muted)}
.ans p{margin:4px 0 0;font-size:15px}
.tipline{background:var(--red-soft);border-radius:8px;padding:8px 10px;font-size:14px!important}
.others{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.olabel{font-size:12px;color:var(--muted);font-weight:600}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px}
.orow .jp{font-size:17px;min-width:4em}

/* lists */
.list{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .w{font-family:var(--jp);font-weight:600;font-size:20px;line-height:1.35}
.item .w small{font-size:14px;color:var(--muted);margin-left:6px}
.item .m{font-size:14px;color:var(--muted)}
.item .miss{font-size:12px;color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:15px}

/* result */
.score{text-align:center;padding:28px 16px}
.stamp{width:120px;height:120px;margin:0 auto 12px;border:4px solid var(--red);border-radius:50%;display:grid;place-content:center;color:var(--red);transform:rotate(-8deg)}
.stamp b{font-size:30px;line-height:1}
.stamp span{font-family:var(--jp);font-weight:600;font-size:14px}

/* photo */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:92px;border-radius:8px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--card);font-size:13px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0}
.field{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea.field{min-height:110px;font-family:ui-monospace,monospace;font-size:13px}
.status{font-size:14px;color:var(--muted);text-align:center;margin:0}
.status.err{color:var(--red)}
.row2{display:flex;gap:8px}
.dash{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{display:flex;flex-direction:column}
.kpis span{font-size:12px;color:var(--muted)}
.kpis b{font-size:26px;line-height:1.15;font-weight:700}
.kpis small{font-size:14px;color:var(--muted);font-weight:500;margin-left:1px}
.kpis b.hot{color:var(--red)}
.progline{display:flex;flex-direction:column;gap:6px}
.progline .bar i{background:var(--ai)} .progline .bar i.met{background:var(--red)}
.charthead{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.charthead>span:last-child{color:var(--ink)}
.legend{margin-left:6px;color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.chart .goaltxt{fill:var(--muted);font-size:9px}
.chart .xl{fill:var(--muted);font-size:9px} .chart .xl.on{fill:var(--ink);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.chart .barm{fill:var(--ai);opacity:.45}
.chart .barm.met{opacity:.8}
.chart .day.sel .barm{opacity:1}
.chart .zero{fill:var(--line)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:6px 2px 0;font-size:15px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(84px,auto) 1fr 44px;align-items:center;gap:10px;width:100%}
.hl{font-size:14px} .hv{font-size:14px;text-align:right;color:var(--ink)}
.ht{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.ht i{display:block;height:100%;background:var(--ai);border-radius:5px}
.item.col{flex-direction:column;align-items:stretch;gap:6px}
.item.col .btn{align-self:flex-start}
.coach p{margin:0 0 6px;font-size:15px;line-height:1.6}
code{font-family:ui-monospace,monospace;font-size:13px;background:var(--soft);padding:1px 5px;border-radius:4px}
details summary{cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
.bookbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.bookbtn h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.bookbtn span{font-size:12px;color:var(--ai);margin-top:-2px}
.pickbook{display:flex;align-items:center;gap:12px;text-align:left;min-height:44px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.radio.on{border:6px solid var(--ai)}
.sumlink{align-self:flex-start;text-align:left;font-size:14px;padding:4px 0;min-width:0}
.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px}
.daynav button{width:44px;height:40px;border-radius:10px;font-size:22px;color:var(--ai)}
.daynav button:disabled{opacity:.25}
.delta{display:block;font-size:12px;margin-top:2px}
.delta.up{color:var(--ok)} .delta.down{color:var(--red)}
.cnt{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px} .cnt.red{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:baseline;gap:6px;background:var(--card);border-radius:10px;padding:7px 11px;font-size:14px}
.wchip .jp{font-size:17px}
.wchip span{color:var(--muted);font-size:13px}
.card .wchip{background:var(--soft)}
.fix{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap}
.fix.ok{color:var(--ok)}
.toplinks{display:flex;gap:4px}
.toplinks .link{min-width:0;padding:10px 6px}
.welcome{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px dashed var(--ai)}
.welcome b{font-size:16px} .welcome span{font-size:14px;color:var(--ai)}
.guide{display:flex;flex-direction:column;gap:10px}
.guide details{padding:0}
.guide summary{padding:16px 18px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px}
.guide details[open] summary::after{content:"−"}
.gbody{padding:0 18px 16px;font-size:15px;line-height:1.7}
.gbody ol,.gbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.gbody dl{margin:0;display:flex;flex-direction:column;gap:2px}
.gbody dt{font-weight:700;margin-top:8px} .gbody dt:first-child{margin-top:0}
.gbody dd{margin:0;color:var(--muted)}
.gbody p{margin:10px 0 0}
kbd{font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.row2>*{flex:1}
</style>
</head>

function parseRows(rows){
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim()));

  const head = rows[0].map(c => String(c ?? '').trim().toLowerCase());
  const find = re => head.findIndex(h => re.test(h));
  let ri = find(/hiragana|히라가나|읽기|후리가나|reading|よみ|ふりがな|kana/);
  let ki = find(/한국어|뜻|의미|korean|meaning/); if(ki >= 0 && /영어|english/.test(head[ki])) ki = -1;
  let ei = find(/영어|english/);
  let wi = head.findIndex((h,i) => i !== ri && i !== ki && /일본어|단어|word|japanese|표기|vocab/.test(h));
  let body = rows.slice(1);
  if(wi < 0 || ki < 0){
    // 제목 줄이 없거나 못 알아본 경우: N5 파일과 같은 순서(번호, 일본어, 한국어, 영어, 히라가나)로 가정

    const off = hasNo ? 1 : 0; wi = off; ki = off + 1; ei = off + 2; ri = off + 3;
    body = HAS_KANJI.test(String(rows[0][wi] ?? '')) || /[\u3040-\u30ff]/.test(String(rows[0][wi] ?? '')) ? rows : rows.slice(1);
  }
  const words = [], seen = new Set(); let skipped = 0;
  for(const r of body){
    const w = String(r[wi] ?? '').trim(), ko = String(r[ki] ?? '').trim();
    let h = ri >= 0 ? String(r[ri] ?? '').trim() : '';
    if(!h && !HAS_KANJI.test(w)) h = w;
    if(!w || !ko || !h || !/^[\u3040-\u30ffー・ 　]+$/.test(h) || seen.has(w + '|' + ko)){ skipped++; continue; }
    seen.add(w + '|' + ko);

function parseCSV(text, sep){
  const rows = []; let row = [], cell = '', q = false;

    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === sep){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }

}

function classify(type, item, chosen){

const DMAP = {}; for(let i=0;i<DAK.length;i+=2){ DMAP[DAK[i]] = DAK[i+1]; DMAP[DAK[i+1]] = DAK[i]; }
Object.assign(DMAP,{ぱ:'ば',ぴ:'び',ぷ:'ぶ',ぺ:'べ',ぽ:'ぼ'});
const YMAP = {ゃ:'や',ゅ:'ゆ',ょ:'よ',や:'ゃ',ゆ:'ゅ',よ:'ょ'};
const O_ROW = 'おこそとのほもよろごぞどぼぽょ', DBL_OK = 'かきくけこさしすせそたちつてとぱぴぷぺぽ';

  const out = new Set(), a = [...r];

    if(DMAP[c]) out.add(r.slice(0,i) + DMAP[c] + r.slice(i+1));

    if(c === 'っ') out.add(r.slice(0,i) + r.slice(i+1));

    if(c === 'う' && i > 0 && O_ROW.includes(a[i-1])) out.add(r.slice(0,i) + r.slice(i+1));

}

  if(type === 'meaning'){

function DayChart(days, goal, sel){

    <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" class="goal"/>
    ${days.map((d,i) => { const x = i*(bw+gap), h = Math.max((H-bot) - y(d.n), d.n ? 2 : 0), isSel = i === sel;
      return `<g class="day ${isSel?'sel':''}" data-day="${i}">
        <rect class="hit" x="${x - gap/2}" y="0" width="${bw+gap}" height="${H}"/>
        ${h ? `<path class="barm ${d.n >= goal ? 'met' : ''}" d="M${x},${H-bot} V${H-bot-h+Math.min(4,h)} Q${x},${H-bot-h} ${x+Math.min(4,bw/2)},${H-bot-h} H${x+bw-Math.min(4,bw/2)} Q${x+bw},${H-bot-h} ${x+bw},${H-bot-h+Math.min(4,h)} V${H-bot} Z"/>` : `<rect class="zero" x="${x}" y="${H-bot-2}" width="${bw}" height="2" rx="1"/>`}
        ${(i % 2 === n % 2 || isSel || i === n-1) ? `<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" class="xl ${isSel?'on':''}">${i === n-1 ? '오늘' : d.label}</text>` : ''}
      </g>`; }).join('')}

}

function HBars(rows, fmt){ // rows: [{label, value, max, note}]
  return `<div class="hbars">${rows.map(r => `<div class="hb"><span class="hl">${esc(r.label)}</span>
    <span class="ht"><i style="width:${r.max ? Math.max(r.value/r.max*100, r.value ? 2 : 0) : 0}%"></i></span><span class="hv num">${fmt(r)}</span></div>`).join('')}</div>`;
}
function analyze(){
  const log = S.log, byType = {}, pat = {}, miss = {}, gram = {};
  for(const [t, id, type, ok, err] of log){
    const bt = byType[type] || (byType[type] = {n:0, c:0}); bt.n++; if(ok) bt.c++;
    if(!ok){ if(err && err !== 'other') pat[err] = (pat[err]||0) + 1; miss[id] = (miss[id]||0) + 1;
      if(type === 'grammar'){ const g = GRAMMAR.find(x => x.id === id); if(g) gram[g.point] = (gram[g.point]||0) + 1; } }
  }
  const findAny = id => allWords().find(w => String(w.id) === String(id)) || GRAMMAR.find(g => g.id === id);
  const top = Object.entries(miss).map(([id,n]) => ({it:findAny(id), n})).filter(x => x.it && !x.it.q).sort((a,b) => b.n - a.n).slice(0, 10);
  const now = Date.now(), wk = 7*864e5;
  const recent = log.filter(l => l[0] > now - wk), prev = log.filter(l => l[0] <= now - wk && l[0] > now - 2*wk);
  const pct = a => a.length ? Math.round(a.filter(l => l[3]).length / a.length * 100) : null;
  return {byType, pat, top, gram, total:log.length, acc:pct(log), recent:pct(recent), prev:pct(prev)};
}

function drillPattern(k){
  const P = PATTERNS[k];
  const missedIds = new Set(S.log.filter(l => !l[3] && l[4] === k).map(l => String(l[1])));
  let pool = allWords().filter(P.test);
  const first = shuffle(pool.filter(w => missedIds.has(String(w.id))));
  const rest = shuffle(pool.filter(w => !missedIds.has(String(w.id))));
  const items = first.concat(rest).slice(0, 15).map(w => ({item:w, type: applicable(w, P.type) ? P.type : 'meaning'}));
  startQuiz(shuffle(items));
}

/* --- AI (교재 사진 → 문제, AI 코치) : API 키는 Supabase Edge Function에만 있음 --- */
async function callClaude(content, maxTokens, signal){
  if(!aiReady()) throw new Error('로그인해야 AI 기능을 쓸 수 있어요.');
  const res = await fetch(SUPABASE_URL + '/functions/v1/claude', {method:'POST', signal,
    headers:{'content-type':'application/json', 'authorization':'Bearer ' + session.access_token, 'apikey':SUPABASE_KEY},
    body: JSON.stringify({max_tokens:maxTokens, messages:[{role:'user', content}]})});
  if(!res.ok) throw new Error(res.status === 429 ? '요청이 많아요. 잠시 후 다시 해 주세요.' : res.status === 401 ? '로그인이 만료됐어요. 설정에서 다시 로그인해 주세요.' : res.status === 404 ? 'AI 함수(claude)가 아직 배포되지 않았어요.' : `AI 요청 실패 (${res.status})`);
  const data = await res.json();
  return (data.content || []).map(b => b.text || '').join('');
}

function shrink(file){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const sc = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
function addSet(raw){
  const seen = new Set();
  const words = (raw.words||[]).filter(x => x && x.w && x.ko && !seen.has(x.w) && seen.add(x.w)).map(x => ({w:String(x.w), h:String(x.h||x.w), ko:String(x.ko), en:String(x.en||'')}));
  const grammar = (raw.grammar||[]).map(g => ({point:String(g.point||''), explain:String(g.explain||''),
    questions:(g.questions||[]).filter(x => x && x.q && Array.isArray(x.choices) && x.choices.length === 4 && x.answer >= 0 && x.answer < 4).map(x => ({q:String(x.q), choices:x.choices.map(String), answer:+x.answer, explain:String(x.explain||'')}))}))
    .filter(g => g.questions.length);
  if(!words.length && !grammar.length) throw new Error('단어나 문법을 찾지 못했어요.');
  const set = {id:Date.now().toString(36), t:Date.now(), title:String(raw.title||'교재 세트').slice(0,40), words, grammar};
  S.sets.unshift(set); rebuild(); save();
  return `‘${set.title}’ 추가 · 단어 ${words.length}개, 문법 ${grammar.reduce((n,g)=>n+g.questions.length,0)}문제`;
}

function render(){
  app.innerHTML = ({home:Home, setup:Setup, quiz:Quiz, result:Result, note:Note, photo:Photo, settings:Settings, analysis:Analysis, books:Books, summary:Summary, guide:Guide}[screen] || Home)();
  const $ = s => app.querySelector(s), $$ = s => app.querySelectorAll(s);
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const on = (s, f) => { const el = $(s); if(el) el.onclick = f; };
  on('#today', startToday);
  on('#startSetup', startSetup);
  $$('[data-set]').forEach(b => b.onclick = () => { const k = b.dataset.set; setup[k] = k === 'count' ? +b.dataset.v : b.dataset.v; try{ localStorage.setItem('n5-setup', JSON.stringify(setup)); }catch(e){} render(); });
  if(screen === 'quiz'){
    $$('.choice').forEach(b => b.onclick = () => answer(quiz.q.choices[+b.dataset.i]));
    const f = $('#typein'); if(f){ f.onsubmit = e => { e.preventDefault(); const v = $('#ti').value.trim(); if(v) answer(v); }; if(!quiz.done) $('#ti').focus(); }
    on('#idk', () => answer(null));
    on('#next', () => { quiz.i++; next(); });
    on('#quit', finish);
  }
  on('#retry', () => startQuiz(shuffle(result.filter(l => !l.ok).map(l => ({item:l.item, type:l.type})))));
  on('#review', () => startQuiz(shuffle(noteList().map(it => it.q ? {item:it, type:'grammar'} : itemFor(it, Object.keys(TYPES).filter(t => t !== 'grammar'))))));
  $$('[data-done]').forEach(b => b.onclick = () => { const r = S.w[b.dataset.done]; r.n = []; r.s = 0; r.t = Date.now(); markGrad(b.dataset.done); save(); render(); });
  on('#importSet', () => { try{ genMsg = addSet(parseJSON($('#setCode').value)); genErr = false; }catch(e){ genMsg = '코드를 읽지 못했어요. 받은 코드를 그대로 전부 붙여 넣어 주세요.'; genErr = true; } render(); });
  $$('[data-day]').forEach(g => g.onclick = () => { daySel = +g.dataset.day; render(); });
  $$('[data-drill]').forEach(b => b.onclick = () => drillPattern(b.dataset.drill));
  on('#drillTop', () => startQuiz(shuffle(analyze().top.map(x => itemFor(x.it, ['meaning','reading','writing','reverse'])))));
  on('#drillGram', () => { const ids = new Set(S.log.filter(l => !l[3] && l[2] === 'grammar').map(l => l[1])); startQuiz(shuffle(GRAMMAR.filter(g => ids.has(g.id)).map(g => ({item:g, type:'grammar'})))); });
  on('#coach', askCoach);
  $$('[data-sum]').forEach(b => b.onclick = () => { sumDay = b.dataset.sum; go('summary'); });
  $$('[data-sumnav]').forEach(b => b.onclick = () => { const d = new Date(sumDay + 'T12:00:00'); d.setDate(d.getDate() + +b.dataset.sumnav); sumDay = dayKey(d); render(); });
  on('#sumCopy', async () => { const t = summaryText(sumDay), msg = $('#sumMsg');
    try{ await navigator.clipboard.writeText(t); msg.textContent = '복사했어요. 메모나 메신저에 붙여 넣으세요.'; }catch(e){ msg.textContent = '복사가 안 돼요. 화면을 캡처해 주세요.'; } });
  on('#sumRetry', () => { const ids = new Set(daySummary(sumDay).wrongList.map(x => String(x.it.id))); startQuiz(shuffle(allWords().filter(w => ids.has(String(w.id))).map(w => itemFor(w, MODES.mix)).concat(GRAMMAR.filter(g => ids.has(g.id)).map(g => ({item:g, type:'grammar'}))))); });
  on('#login', async () => { const email = $('#email').value.trim(), pw = $('#pw').value; if(!email || !pw) return;
    cloudMsg = '로그인 중…'; cloudErr = false; render();
    const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
    if(error){ cloudMsg = /invalid/i.test(error.message) ? '이메일이나 비밀번호가 맞지 않아요.' : error.message; cloudErr = true; render(); return; }
    session = data.session; cloudMsg = ''; await pull(); render(); });
  on('#logout', async () => { await sb.auth.signOut(); session = null; cloudMsg = '로그아웃했어요. 이 기기의 기록은 그대로 남아 있어요.'; render(); });
  on('#syncNow', async () => { await pull(); render(); });
  $$('[data-book]').forEach(b => b.onclick = () => { S.book = b.dataset.book; applyBook(); save(); bookMsg = ''; render(); });
  $$('[data-delbook]').forEach(b => b.onclick = () => { const id = b.dataset.delbook; if(delBook !== id){ delBook = id; return render(); }
    delBook = null; S.books = S.books.filter(x => x.id !== id); S.del.push(id); for(const k in S.w) if(k.startsWith(id + ':')) delete S.w[k];
    if(S.book === id) S.book = 'n5'; applyBook(); save(); render(); });
  const bf = $('#bookFile'); if(bf) bf.onchange = async () => { const f = bf.files[0]; if(!f) return; bookMsg = '읽는 중…'; bookErr = false; render();
    try{ bookMsg = await importBook(f); }catch(e){ bookMsg = e.message || '파일을 읽지 못했어요.'; bookErr = true; } render(); };
  const pk = $('#pick'); if(pk) pk.onchange = () => { [...pk.files].forEach(f => photos.push({file:f, url:URL.createObjectURL(f)})); genMsg = ''; render(); };
  $$('[data-rm]').forEach(b => b.onclick = () => { photos.splice(+b.dataset.rm, 1); render(); });
  on('#make', generate);
  on('#stop', () => gen && gen.abort());
  $$('[data-play]').forEach(b => b.onclick = () => {
    const id = b.dataset.play;
    startQuiz(shuffle(CUSTOM.filter(w => w.set === id).map(w => itemFor(w, MODES.mix)).concat(GRAMMAR.filter(g => g.set === id).map(g => ({item:g, type:'grammar'})))));
  });
  $$('[data-del]').forEach(b => b.onclick = () => { const id = b.dataset.del; if(delId !== id){ delId = id; return render(); } delId = null; S.sets = S.sets.filter(s => s.id !== id); S.del.push(id); rebuild(); save(); render(); });
  $$('[data-goal]').forEach(b => b.onclick = () => { S.goal = +b.dataset.goal; save(); render(); });
  on('#copy', async () => { const code = JSON.stringify(S); const msg = $('#bmsg');
    try{ await navigator.clipboard.writeText(code); msg.textContent = '복사했어요. 다른 기기의 설정에서 붙여 넣으세요.'; }
    catch(e){ const t = $('#backup'); t.value = code; t.select(); msg.textContent = '자동 복사가 안 돼서 아래 칸에 넣었어요. 전체 선택해서 복사하세요.'; } });
  on('#restore', () => { const msg = $('#bmsg');
    try{ const d = JSON.parse($('#backup').value); if(!d || !d.w) throw 0; S = normalize(d); rebuild(); applyBook(); save(); msg.textContent = '불러왔어요.'; }
    catch(e){ msg.textContent = '백업 코드가 올바르지 않아요.'; msg.classList.add('err'); } });
}
document.addEventListener('keydown', e => {
  if(screen !== 'quiz' || !quiz || e.target.tagName === 'INPUT') return;
  if(!quiz.done && quiz.q.choices && /^[1-4]$/.test(e.key)) answer(quiz.q.choices[+e.key - 1]);
  else if(quiz.done && e.key === 'Enter'){ quiz.i++; next(); }
});
/* ===== Supabase 동기화 ===== */
let sb = null, session = null, cloudMsg = '', cloudErr = false, pushTimer = null, pushing = false, pushAgain = false;
const aiReady = () => !!(sb && session);
function mergeState(a, b){
  const m = normalize({});
  const newer = (b.u || 0) > (a.u || 0) ? b : a;
  m.goal = newer.goal; m.book = newer.book; m.u = Math.max(a.u || 0, b.u || 0);
  m.del = [...new Set([...(a.del||[]), ...(b.del||[])])];
  const dels = new Set(m.del);
  for(const src of [a, b]) for(const [k, r] of Object.entries(src.w || {})){ const cur = m.w[k]; if(!cur || (r.t || 0) > (cur.t || 0)) m.w[k] = r; }
  for(const src of [a, b]) for(const [k, d] of Object.entries(src.days || {})){ const v = typeof d === 'number' ? {n:d, c:0} : d; if(!m.days[k] || v.n > m.days[k].n) m.days[k] = v; }
  const seen = new Set(); m.log = [];
  for(const l of [...(a.log||[]), ...(b.log||[])].sort((x,y) => x[0] - y[0])){ const key = l[0] + '|' + l[1]; if(!seen.has(key)){ seen.add(key); m.log.push(l); } }
  m.log = m.log.slice(-4000);
  const union = (x, y) => { const map = new Map(); for(const it of [...(x||[]), ...(y||[])]) if(!dels.has(it.id)) map.set(it.id, it); return [...map.values()]; };
  for(const src of [a, b]) for(const [k, ids] of Object.entries(src.grad || {})) m.grad[k] = [...new Set([...(m.grad[k]||[]), ...ids])];
  m.sets = union(a.sets, b.sets).sort((x,y) => (y.t||0) - (x.t||0)); m.books = union(a.books, b.books);
  return m;
}
async function pull(){
  if(!sb || !session) return;
  try{
    const {data, error} = await sb.from('n5_progress').select('data').eq('user_id', session.user.id).maybeSingle();
    if(error) throw error;
    if(data && data.data) S = mergeState(S, normalize(data.data));
    rebuild(); applyBook();
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    await push();
  }catch(e){ cloudMsg = '동기화 실패: ' + (e.message || e); cloudErr = true; }
}
async function push(){
  if(!sb || !session) return;
  if(pushing){ pushAgain = true; return; }
  pushing = true;
  try{
    const {error} = await sb.from('n5_progress').upsert({user_id:session.user.id, data:S, updated_at:new Date().toISOString()});
    if(error) throw error;
    cloudMsg = '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}); cloudErr = false;
  }catch(e){ cloudMsg = '저장 실패: ' + (e.message || e); cloudErr = true; }
  pushing = false;
  if(pushAgain){ pushAgain = false; push(); }
}
function schedulePush(){ if(!sb || !session) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 2000); }
async function initCloud(){
  if(!SUPABASE_URL || !SUPABASE_KEY) return;
  try{
    await new Promise((ok, bad) => { const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    const {data} = await sb.auth.getSession(); session = data.session;
    sb.auth.onAuthStateChange((_e, s) => { session = s; });
    if(session) await pull();
  }catch(e){ cloudMsg = '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'; }
  if(screen !== 'quiz') render();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && session && screen !== 'quiz') pull().then(() => { if(screen !== 'quiz') render(); }); });
render();
initCloud();
